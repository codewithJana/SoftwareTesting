    - generic:
      - generic:
        - heading "7 Principles of Software Testing (Part 1)" [level=2]
        - generic:
          - generic:
            - generic: "1"
            - generic:
              - heading "Testing shows defects, not their absence" [level=3]
              - paragraph: Testing dramatically reduces the probability of undiscovered bugs, but it is mathematically impossible to prove that a software application is 100% bug-free.
              - generic:
                - strong: "Example:"
                - text: A login form passes 1,000 regression tests successfully, but a unique special character in a password still crashes the database query.
          - generic:
            - generic: "2"
            - generic:
              - heading "Exhaustive testing is impossible" [level=3]
              - paragraph: Testing every single combination of data inputs, permutations, and preconditions is mathematically infeasible. Instead, we must use Risk-Based Testing to prioritize scenarios.
              - generic:
                - strong: "Example:"
                - text: A simple text field accepting up to 256 characters has 26
                - superscript: "256"
                - text: alphanumeric permutations—more than the atoms in the observable universe.
          - generic:
            - generic: "3"
            - generic:
              - heading "Early testing saves time & money" [level=3]
              - paragraph: Finding bugs early in the lifecycle is infinitely cheaper. A defect caught during requirement drafting costs pennies, while the same defect caught in production demands expensive patches.
              - generic:
                - strong: "Example:"
                - text: Fixing a missing field in a requirements doc takes 30 mins. In production, it requires db schema migration, API updates, client app releases, and a hotfix.
    - generic:
      - generic:
        - heading "7 Principles of Software Testing (Part 2)" [level=2]
        - generic:
          - generic:
            - generic:
              - generic: "4"
              - heading "Defect Clustering" [level=3]
            - paragraph: Similar to the Pareto Principle (80/20 Rule), 80% of application failures are typically found in 20% of the modules. Focus testing on complex, highly integrated, or legacy code areas.
            - generic:
              - strong: "Flipkart Cart Example:"
              - text: Payment integrations and discount coupon processing contain 70% of checkout failures.
          - generic:
            - generic:
              - generic: "5"
              - heading "Pesticide Paradox" [level=3]
            - paragraph: If you execute the same set of automated tests repeatedly, they will eventually stop finding new bugs. Test cases must be continuously revised, upgraded, and expanded to remain effective.
            - generic:
              - strong: "Regression Example:"
              - text: An unmodified 6-month-old test suite stays green, while newly written feature code goes completely untested.
          - generic:
            - generic:
              - generic: "6"
              - heading "Testing is Context-Dependent" [level=3]
              - img
            - paragraph: Testing strategies vary drastically depending on the product type, audience, and risk profile. An e-commerce app, a flight guidance system, and a banking API require completely different lifecycles.
            - generic:
              - strong: "Context Example:"
              - text: A mobile game focuses on frame rate and UX, while an AI medical tool focuses on strict HIPAA compliance and algorithm bias.
          - generic:
            - generic:
              - generic: "7"
              - heading "Absence-of-Errors Fallacy" [level=3]
            - paragraph: Finding and fixing defects is useless if the system remains unusable or fails to fulfill user needs. A "zero-bug" application that has a horrible user experience will still fail commercially.
            - generic:
              - strong: "User Flow Example:"
              - text: A flawlessly coded 12-step checkout flow loses 80% of customers to a competitor's simple 2-click buy setup.
